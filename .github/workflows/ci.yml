name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request cancels the run it replaces. A push to main is a group of its own,
# so every commit on main keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: cargo fmt --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Only main saves a cache, and a pull request restores main's: the repository holds
      # 10 GB of cache, and caches saved by pull requests pushed main's out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --locked
      # The fixtures, which only a build with the feature compiles.
      - run: cargo clippy -p pitboard-ffi --all-targets --locked --features fixture

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -- --skip writing_preserves_attributes
      # The fixtures, each a world on the real core, which only a build with the feature has.
      - run: cargo test --locked -p pitboard-ffi --features fixture
      # Asserts a read-latency threshold that concurrent `security` calls can breach, so it
      # runs alone. It exists only on macOS.
      - if: runner.os == 'macOS'
        run: cargo test --locked -p pitboard --test keychain_write_is_harmless writing_preserves_attributes

  # The install script under each shell named here, against a stub release and with no network.
  install-script:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: sh dash bash zsh busybox
          - os: macos-latest
            shells: sh dash bash zsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Ubuntu image has neither zsh nor BusyBox, and the script has to run under both.
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh busybox
      # 0.11.0 takes test's -ef from POSIX.1-2024; the Ubuntu image has 0.9.0.
      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: shellcheck@0.11.0
      - if: runner.os == 'Linux'
        run: shellcheck -s sh packaging/install.sh .github/scripts/fill-template.sh
      - env:
          TEST_INSTALL_SHELLS: ${{ matrix.shells }}
        run: python3 .github/scripts/test-install.py

  # Windows, where the core compiles and refuses whatever is not built yet. Each image is
  # named, never windows-latest, so a new image is a change made on purpose.
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            triple: x86_64-pc-windows-msvc
            machine: AMD64
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            machine: ARM64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # RUSTFLAGS replaces every target's own rustflags, so the static C runtime a Windows
      # release is built with is named here. The cfg opens the build to Windows before Windows
      # is released, for the lints and the tests (pitboard-core's release.rs); the gate is
      # checked below on a build without it.
      RUSTFLAGS: -D warnings -C target-feature=+crt-static --cfg pitboard_unreleased_windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ring compiles its C with clang on ARM64 Windows, and nothing else, so the image's clang
      # is said first.
      - if: runner.arch == 'ARM64'
        run: clang --version
      - run: rustup toolchain install
      # Every build below is for the machine Rust says it runs on, so that must be this leg's:
      # an x64 Rust that an ARM64 image ran under emulation would build, check and test x64.
      - name: Rust builds for this leg's machine
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "Rust's host is $host"
          test "$host" = "$TRIPLE"
      # What the image is, for the record of each image's facts: its Windows build, Rust,
      # LLVM and Visual Studio. Said, never relied on.
      - name: This image
        shell: pwsh
        run: |
          cmd /c ver
          rustc -vV
          Get-Command clang, llvm-readobj -ErrorAction SilentlyContinue | Select-Object Name, Source
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property catalog_productDisplayVersion
            & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          }
          exit 0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # What a release builds: no test-support and no cfg, so the release gate is closed. In a
      # folder of its own, so the lints and tests below keep theirs.
      - env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
        run: cargo build --locked -p pitboard
      # That build is a program for this leg's machine, answers --version, holds its C runtime,
      # and refuses every command with windows_not_released, leaving every folder it is
      # pointed at empty. Its folders are set in this step alone, since Cargo and rustup find
      # their own homes through USERPROFILE.
      - name: A Windows build of a 0.x release changes nothing
        shell: pwsh
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target\gated\debug\pitboard.exe').Path
          $readobj = Get-Command llvm-readobj -ErrorAction SilentlyContinue
          $readobj = if ($readobj) { $readobj.Source } else { "$env:ProgramFiles\LLVM\bin\llvm-readobj.exe" }
          $headers = & $readobj --file-headers $exe | Out-String
          if ($headers -notmatch "Machine: IMAGE_FILE_MACHINE_$env:MACHINE\b") {
            Write-Output $headers
            throw "pitboard.exe is not a program for $env:MACHINE"
          }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw '--version did not answer' }
          $imports = & $readobj --coff-imports $exe | Out-String
          if ($imports -match '(?i)vcruntime|api-ms-win-crt') {
            Write-Output $imports
            throw 'pitboard.exe takes its C runtime from a DLL: it was built without +crt-static'
          }
          $root = Join-Path $env:RUNNER_TEMP 'release-gate'
          $folders = 'USERPROFILE', 'HOME', 'APPDATA', 'LOCALAPPDATA', 'CODEX_HOME', 'CLAUDE_CONFIG_DIR', 'PITBOARD_HOME'
          foreach ($folder in $folders) {
            $path = Join-Path $root $folder
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            Set-Item -Path "env:$folder" -Value $path
          }
          $commands = @(
            @('status', '--json'),
            @('use', 'x', '--json'),
            @('renew', '--json'),
            @('schedule', 'install', '--json')
          )
          foreach ($command in $commands) {
            $printed = & $exe @command | Out-String
            $exit = $LASTEXITCODE
            $code = ($printed | ConvertFrom-Json).error.code
            if ($exit -ne 1 -or $code -ne 'windows_not_released') {
              throw "pitboard $($command -join ' ') exited $exit with $code`: $printed"
            }
          }
          foreach ($folder in $folders) {
            $left = @(Get-ChildItem -Force -Path (Join-Path $root $folder))
            if ($left.Count -ne 0) { throw "$folder holds $($left.Name -join ', ')" }
          }
          # The runner ends a PowerShell step with the last program's exit code, which here is
          # a refusal's.
          exit 0
      # Built first: every test step below lists Credential Manager with it for the leak check.
      - run: cargo build --locked -p pitboard-probe
      # Tests from here run as a fresh standard user: the job's user is elevated in every program.
      # windows_refuses as it runs against a build that is not opened: every one of its
      # changes and reads refuses with windows_not_released, and every folder stays empty.
      - name: windows_refuses, not opened, as a standard user
        shell: pwsh
        env:
          RUSTFLAGS: -D warnings -C target-feature=+crt-static
          CARGO_TARGET_DIR: target/gated
        run: >
          ./.github/scripts/test-as-standard-user.ps1 -Cargo '--locked -p pitboard --test windows_refuses'
          -Probe target/debug/pitboard-probe.exe
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo clippy -p pitboard-ffi --all-targets --locked --features fixture
      # No filter and no --skip: a test that waits for a later pull request says so in its attribute.
      - name: The workspace's tests, as a standard user
        shell: pwsh
        run: >
          ./.github/scripts/test-as-standard-user.ps1 -Cargo '--locked --workspace'
          -Probe target/debug/pitboard-probe.exe
      - name: pitboard-ffi with its fixtures, as a standard user
        shell: pwsh
        run: >
          ./.github/scripts/test-as-standard-user.ps1 -Cargo '--locked -p pitboard-ffi --features fixture'
          -Probe target/debug/pitboard-probe.exe
      # Runs the opened pitboard.exe the workspace's tests built.
      - name: An opened build refuses a change as the elevated job user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'target\debug\pitboard.exe').Path
          $root = Join-Path $env:RUNNER_TEMP 'elevated-refusal'
          $folders = 'USERPROFILE', 'HOME', 'APPDATA', 'LOCALAPPDATA', 'CODEX_HOME', 'CLAUDE_CONFIG_DIR', 'PITBOARD_HOME'
          foreach ($folder in $folders) {
            $path = Join-Path $root $folder
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            Set-Item -Path "env:$folder" -Value $path
          }
          foreach ($command in @(@('use', 'x', '--json'), @('renew', '--json'))) {
            $printed = & $exe @command | Out-String
            $exit = $LASTEXITCODE
            $refusal = ($printed | ConvertFrom-Json).error
            if ($exit -ne 1 -or $refusal.code -ne 'elevated') {
              throw "pitboard $($command -join ' ') exited $exit with $($refusal.code)`: $printed"
            }
            if ($refusal.message -notmatch 'as every program this Windows account starts does') {
              throw "the job user's token is not split, so the refusal names every program: $($refusal.message)"
            }
            Write-Output "pitboard $($command -join ' '): $($refusal.message)"
          }
          foreach ($folder in $folders) {
            $left = @(Get-ChildItem -Force -Path (Join-Path $root $folder))
            if ($left.Count -ne 0) { throw "$folder holds $($left.Name -join ', ')" }
          }
          exit 0

  # The floor the manifests promise, on Windows. ring compiles C against the target's own
  # headers, so a Windows check needs a Windows C toolchain: the MSVC this image has, never
  # a cross-check from Linux.
  windows-msrv:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static --cfg pitboard_unreleased_windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-hack@0.6.45
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --rust-version installs the rust-version in Cargo.toml and checks with it; the
      # workspace behaviour keeps it one cargo check, not one per package.
      - run: cargo hack check --rust-version --workspace-behavior=cargo --workspace --all-targets --locked
      - run: cargo hack check --rust-version --workspace-behavior=cargo -p pitboard-ffi --all-targets --locked --features fixture

  apple:
    # The image and the Xcode are named, so a new one is a change made on purpose.
    runs-on: macos-26
    # Each UI test has its own allowance below; this stops a job stuck anywhere else.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The newest Xcode on macos-26. Development uses 27.1, which GitHub has only on its
      # preview xcode-27 image.
      - run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version
      - run: rustup toolchain install
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # PitboardBindings and PitboardShareBindings are generated, so only what is written by
      # hand is checked.
      - run: >
          swift format lint --strict --recursive --configuration apps/macos/.swift-format
          apps/macos/Sources/PitboardApp apps/macos/Sources/PitboardKit apps/macos/Sources/PitboardLinkTarget
          apps/macos/App apps/macos/ShareExtension apps/macos/UITests apps/macos/Tests apps/macos/scripts
          .github/scripts
      - uses: ./.github/actions/xcodegen
      # Proves the core still links into the app, that its bindings still match, and that
      # the bundle still assembles and signs.
      - run: ./apps/macos/scripts/build-app.sh
      # The command line the app comes with is what its renewal schedule runs and what the
      # cask puts on PATH, so it is run from inside the bundle, checked for both
      # architectures, and the bundle verified with it in place.
      - run: |
          helper=apps/macos/build/Pitboard.app/Contents/Helpers/pitboard
          "$helper" --version
          for arch in arm64 x86_64; do lipo "$helper" -verify_arch "$arch"; done
          codesign --verify --strict --deep apps/macos/build/Pitboard.app
      # The core again, with its fixtures: the worlds the debug build and the UI tests
      # launch into, and the one the package's tests start a model in, are Rust's, and only
      # a library built so has them. Their bindings are the same either way. Only after the
      # release is built and checked above, since this empties apps/macos/build, and
      # build-app.sh never passes it.
      - run: ./apps/macos/scripts/build-xcframework.sh --fixture
      - run: swift test --package-path apps/macos
      # The app driven the way a person drives it: the debug build, started by each test in
      # a fixture rather than on this runner's own accounts. A UI test needs Automation Mode,
      # which asks for a password unless the machine allows it without one. GitHub's macOS
      # images are built to allow it and check that they do, and a runner that did not
      # would hang until the test timed out, so that is said first and plainly. Each test
      # fails alone after two minutes, five times the slowest one's 22 s in CI, and the rest
      # still run.
      - id: ui
        run: |
          mode=$(automationmodetool)
          echo "$mode"
          case "$mode" in
            *"DOES NOT REQUIRE"*) ;;
            *) echo "this runner asks for a password before UI tests can run" >&2; exit 1 ;;
          esac
          xcodebuild test -project apps/macos/Pitboard.xcodeproj -scheme Pitboard \
            -destination 'platform=macOS' -derivedDataPath apps/macos/build/UITestData \
            -clonedSourcePackagesDirPath apps/macos/build/SourcePackages \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult"
      # The result bundle has what the log cannot: a screenshot and the tree of elements at
      # the moment a test failed. Nobody needs it when they all pass.
      - if: failure() && steps.ui.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UITests.xcresult
          path: ${{ runner.temp }}/UITests.xcresult

  csharp:
    # The Windows app reaches the core through these bindings. They are generated from the
    # core, compiled and called on every change, so a change C# cannot express, or bindings
    # that no longer match the library, fail here rather than in the app.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: apps/windows/global.json
      - run: cargo build --locked --release -p pitboard-ffi
      # Read from the static library: the release profile strips the shared one, and with
      # it the metadata the generator reads, which it answers by writing nothing at all.
      - run: |
          mkdir -p apps/windows/Pitboard.Core/Generated
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/libpitboard_ffi.a \
            --out-dir apps/windows/Pitboard.Core/Generated \
            --config crates/pitboard-ffi/uniffi.toml --no-format
          test -s apps/windows/Pitboard.Core/Generated/pitboard_ffi.cs
      # global.json, which pins the SDK and the test platform, is read from where dotnet runs.
      # The test of a fixture's model is skipped here, against a library with no fixtures.
      - working-directory: apps/windows
        run: >
          dotnet test --solution Pitboard.slnx
          -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_ffi.so"
      # The same library with its fixtures, which a debug build of either app launches into.
      # Its bindings must be the very ones generated without them, which is what lets one
      # set serve both, and the library without them must hold none of a fixture's text.
      - run: |
          if LC_ALL=C grep -a -q -e 'A Pitboard fixture page' -e 'dana@work.example' \
            target/release/libpitboard_ffi.so; then
            echo "a library built without the fixture feature holds a fixture" >&2
            exit 1
          fi
          cargo build --locked --release -p pitboard-ffi --features fixture
          mkdir -p "$RUNNER_TEMP/fixture-bindings"
          cargo run --locked --release -p uniffi-bindgen-csharp -- \
            --library target/release/libpitboard_ffi.a \
            --out-dir "$RUNNER_TEMP/fixture-bindings" \
            --config crates/pitboard-ffi/uniffi.toml --no-format
          cmp apps/windows/Pitboard.Core/Generated/pitboard_ffi.cs \
            "$RUNNER_TEMP/fixture-bindings/pitboard_ffi.cs"
      # Here the fixture's model is started, and tells a listener written in C# of its
      # accounts from a thread of its own.
      - working-directory: apps/windows
        run: >
          dotnet test --solution Pitboard.slnx
          -p:PitboardNativeLibrary="$GITHUB_WORKSPACE/target/release/libpitboard_ffi.so"

  # The floor the manifests promise, built the way someone on an older toolchain builds it.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-hack@0.6.45
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo hack check --rust-version --workspace-behavior=cargo --workspace --all-targets --locked
      # The fixtures, which only a build with the feature compiles.
      - run: cargo hack check --rust-version --workspace-behavior=cargo -p pitboard-ffi --all-targets --locked --features fixture

  semver:
    # What pitboard-core's last version on crates.io promises. A change that breaks it needs
    # the version in Cargo.toml raised, as RELEASING.md says, and fails here until it is.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: pitboard-core

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # The workflows, actions and scripts in .github themselves.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: zizmor@1.30.1
      # Offline, so a run fails only on what the repository holds. Informational findings
      # suggest rewrites, not risks.
      - run: zizmor --offline --min-severity low --config .github/zizmor.yml .
      # The scripts' functions are their own helpers, not published cmdlets, so the naming and
      # -WhatIf rules are left out. The plain-text password each gives the throwaway user it
      # makes is random and never leaves the runner.
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-PSResource PSScriptAnalyzer -Version 1.25.0 -TrustRepository -Quiet
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0
          $found = Invoke-ScriptAnalyzer -Path .github/scripts -Recurse -Severity Error, Warning `
            -ExcludeRule PSUseSingularNouns, PSUseShouldProcessForStateChangingFunctions, PSAvoidUsingConvertToSecureStringWithPlainText
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }
      # The update key rehearsal ships bundles that really do update themselves, so it must
      # never be able to reach the real key, the real certificate or the real feed. A job that
      # never asks for a repository secret cannot be handed one, and that is worth knowing on
      # the pull request that changes it rather than the month after.
      - name: The update key rehearsal names no repository secret
        run: |
          if grep -q 'secrets\.' .github/workflows/rotation.yml; then
            echo "the rehearsal asks for a repository secret, so it can be given one" >&2
            exit 1
          fi

  # The usepitboard.com site in website/. A pull request that changes none of the files its
  # build and tests read, listed in `touched`, skips the steps and passes. The build reads the
  # latest release from GitHub, writes the CSP and fails on any rule guard.mjs keeps.
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request's checkout is its merge commit, whose first parent is the base.
      - id: touched
        working-directory: .
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git diff --quiet HEAD^1 HEAD -- \
            website CHANGELOG.md docs crates/pitboard/src/watch.rs .github/workflows/ci.yml; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing the site reads changed"
          fi
      - if: steps.touched.outputs.run
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.node-version
          package-manager-cache: false
      - if: steps.touched.outputs.run
        run: npm ci
      - if: steps.touched.outputs.run
        run: npx prettier --check .
      - if: steps.touched.outputs.run
        run: npm run check
      - if: steps.touched.outputs.run
        run: npm test
      - if: steps.touched.outputs.run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

  # The one check a merge on main needs. It fails when any job above failed or was cancelled,
  # and runs even then, since a required check that was skipped counts as passed. A job added
  # above goes in its needs.
  all-green:
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - install-script
      - windows
      - windows-msrv
      - apple
      - csharp
      - msrv
      - semver
      - deny
      - workflows
      - website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
