version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # UniFFI moves only together with the C# generator, uniffi-bindgen-cs, which is released
      # for one UniFFI version at a time. Cargo.toml says why.
      - dependency-name: "uniffi*"
  # "/" alone reads the workflows only, not the actions under .github/actions.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The SDK in global.json. MSTest.Sdk beside it is raised by hand: Dependabot does not read
  # msbuild-sdks.
  - package-ecosystem: dotnet-sdk
    directory: /apps/windows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check takes TypeScript 5 or 6 only.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
