version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # UniFFI moves only together with the C# generator, uniffi-bindgen-cs, which is released
      # for one UniFFI version at a time. Cargo.toml says why.
      - dependency-name: "uniffi*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # The SDK in global.json. MSTest.Sdk beside it is raised by hand: Dependabot does not read
  # msbuild-sdks.
  - package-ecosystem: dotnet-sdk
    directory: /apps/windows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
