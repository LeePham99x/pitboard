name: Something went wrong
description: A command did the wrong thing, or said something that was not true
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        `pitboard doctor --json` answers most of what a report needs. It prints the labels
        you chose, codes, paths and times. No tokens, no email addresses and no account
        identifiers: those become digests, so two mentions of one account line up inside
        your report without naming it, and two reports do not line up with each other.
        Paths under your home are shortened to `~`. On Windows, paths under your
        `AppData\Local` folder are shortened to `%LOCALAPPDATA%`, and your user name and SID
        are hidden.

        `pitboard doctor` without `--json` is the one to read yourself; it shows your own
        account, and is not the one to paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran, what it printed, and what you expected instead.
      placeholder: |
        $ pitboard use work
        ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: pitboard doctor --json
      render: json
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`pitboard --version`, `claude --version` and `codex --version` for whichever you use, and your macOS or Linux version. On Windows, give the build and the system type, x64 or ARM64, which Settings > System > About shows."
      placeholder: "pitboard 1.0.0-beta.1, Claude Code 2.1.302, codex-cli 0.163.0, Windows 11 build 26100, x64"
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: The last few lines of pitboard log
      description: Optional. Read them before you paste them. A `reclaim` line whose outcome is `discarded` names a parked login, and that name holds an account id.
      render: text
