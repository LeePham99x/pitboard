# flaky-result came in 0.9.131.
nextest-version = "0.9.131"

# These time keychain reads, which `security` calls from other tests slow down. Run first,
# they start without waiting for every running test to end.
[[profile.default.overrides]]
filter = "binary_id(pitboard::keychain_write_is_harmless)"
threads-required = "num-test-threads"
priority = 100

# Credential Manager's counterpart, alone as that one runs.
[[profile.default.overrides]]
filter = "binary_id(pitboard::credman_write_is_harmless)"
threads-required = "num-test-threads"
priority = 100

[profile.ci]
fail-fast = false
# A retry tells a flaky test from a failing one, and a flaky test still fails the run.
retries = 1
flaky-result = "fail"
slow-timeout = { period = "60s", terminate-after = 3 }

# 10,000 replaces of a file on Windows, each flushed to the disk with its folder, outlast the
# 180 s above.
[[profile.ci.overrides]]
filter = "binary_id(pitboard-core) & test(=host::windows::fs::tests::ten_thousand_replaces_never_leave_a_reader_without_the_whole_file)"
slow-timeout = { period = "120s", terminate-after = 5 }

# 1000 sign-ins started and stopped on Windows, each two programs.
[[profile.ci.overrides]]
filter = "binary_id(pitboard-core) & test(=host::windows::job::tests::a_program_started_at_once_is_in_the_job_every_time)"
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
