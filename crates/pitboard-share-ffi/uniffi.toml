[bindings.swift]
module_name = "PitboardShareBindings"
ffi_module_name = "PitboardShareFFI"
ffi_module_filename = "PitboardShareFFI"
generate_immutable_records = true
# The extension shows the refusal's own sentence, which the error carries.
omit_localized_error_conformance = true

[bindings.csharp]
namespace = "Pitboard.Share.Core"
# The library PitboardShare.exe loads, pitboard_share_ffi.dll, whatever file the bindings were read from.
cdylib_name = "pitboard_share_ffi"
# The bindings are an assembly of their own, which PitboardShare.exe and its tests reference.
access_modifier = "public"
